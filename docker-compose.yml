services:
  kiki-app:
    # La imagen se construye a partir del código de este repositorio.
    # No hay nada publicado en Docker Hub ni en ningún otro registro.
    build:
      context: .
      dockerfile: Dockerfile
    # Sólo es la etiqueta local que recibe la imagen recién construida.
    image: kiki-app:latest
    # Fuerza construir en lugar de intentar descargar, también en Portainer.
    pull_policy: build
    container_name: kiki_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=Europe/Madrid
    volumes:
      - kiki_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kiki_data:
